name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    # Forks get a read-only token, so they cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/setup@v2
      # One _quarto-<lang>.yml per language edition, each rendered to
      # _book/<lang>. The default edition (profile.default in _quarto.yml) is
      # served at the root of the site, every other edition at /<lang>/.
      - name: Build HTML
        if: github.event.action != 'closed'
        run: |
          default="$(yq -r '.profile.default' _quarto.yml)"
          mkdir -p site
          for profile in _quarto-*.yml; do
            lang="${profile#_quarto-}"
            lang="${lang%.yml}"
            quarto render --profile "$lang" --to html
            if [ "$lang" = "$default" ]; then
              cp -r "_book/$lang/." site/
            else
              mkdir -p "site/$lang"
              cp -r "_book/$lang/." "site/$lang/"
            fi
          done

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          pages-base-url: ma-quetilye-quenya.tolkien.lu
          qr-code: "false"
