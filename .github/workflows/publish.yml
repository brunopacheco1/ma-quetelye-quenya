on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [closed]
  workflow_dispatch:

name: Publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == 'pull_request' && "${{ github.event.pull_request.merged }}" == 'true' && "${{ contains(github.event.pull_request.labels.*.name, 'release') }}" == 'true' ]]; then
            TITLE="${{ github.event.pull_request.title }}"
            VERSION=${TITLE#Release }
            
            # Ensure version starts with v
            if [[ $VERSION != v* ]]; then
              VERSION="v$VERSION"
            fi
            
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

          # A manual run redeploys the site from the latest release tag
          # without creating a new release.
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "redeploy_tag=$(git describe --tags --abbrev=0 --match 'v*')" >> $GITHUB_OUTPUT
          fi

      - name: Check out latest release
        if: steps.version.outputs.redeploy_tag != ''
        run: git checkout ${{ steps.version.outputs.redeploy_tag }}

      - name: Push Tag
        if: steps.version.outputs.is_release == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install TinyTeX
        run: quarto install tinytex
      # One _quarto-<lang>.yml per language edition, each rendered to
      # _book/<lang>; a new edition needs no change here.
      - name: Build every language edition in every format
        run: |
          for profile in _quarto-*.yml; do
            lang="${profile#_quarto-}"
            lang="${lang%.yml}"
            quarto render --profile "$lang"
          done
      - name: Prepare Release Artifacts
        if: steps.version.outputs.is_release == 'true'
        run: |
          mkdir -p release_artifacts
          VERSION="${{ steps.version.outputs.version }}"
          name="$(yq -r '.book["output-file"]' _quarto.yml)"
          ls -R _book
          for profile in _quarto-*.yml; do
            lang="${profile#_quarto-}"
            lang="${lang%.yml}"
            cp "_book/$lang/$name.pdf" "release_artifacts/$name-$lang-$VERSION.pdf"
            cp "_book/$lang/$name.epub" "release_artifacts/$name-$lang-$VERSION.epub"
          done
      - name: Upload release artifacts
        if: steps.version.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: book-artifacts
          path: release_artifacts/
      # The default edition (profile.default in _quarto.yml) is served at the
      # root of the site, every other edition at /<lang>/.
      - name: Assemble site
        if: steps.version.outputs.is_release == 'true' || steps.version.outputs.redeploy_tag != ''
        run: |
          default="$(yq -r '.profile.default' _quarto.yml)"
          mkdir -p site
          for profile in _quarto-*.yml; do
            lang="${profile#_quarto-}"
            lang="${lang%.yml}"
            if [ "$lang" = "$default" ]; then
              cp -r "_book/$lang/." site/
            else
              mkdir -p "site/$lang"
              cp -r "_book/$lang/." "site/$lang/"
            fi
          done
          echo "ma-quetilye-quenya.tolkien.lu" > site/CNAME
          touch site/.nojekyll
      - name: Deploy to GitHub Pages
        if: steps.version.outputs.is_release == 'true' || steps.version.outputs.redeploy_tag != ''
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: book-artifacts
          path: release_artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: release_artifacts/*
