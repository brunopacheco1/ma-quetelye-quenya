on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [closed]
  workflow_dispatch:

name: Publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == 'pull_request' && "${{ github.event.pull_request.merged }}" == 'true' && "${{ contains(github.event.pull_request.labels.*.name, 'release') }}" == 'true' ]]; then
            TITLE="${{ github.event.pull_request.title }}"
            VERSION=${TITLE#Release }
            
            # Ensure version starts with v
            if [[ $VERSION != v* ]]; then
              VERSION="v$VERSION"
            fi
            
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

          # A manual run redeploys the site from the latest release tag
          # without creating a new release.
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "redeploy_tag=$(git describe --tags --abbrev=0 --match 'v*')" >> $GITHUB_OUTPUT
          fi

      - name: Check out latest release
        if: steps.version.outputs.redeploy_tag != ''
        run: git checkout ${{ steps.version.outputs.redeploy_tag }}

      - name: Push Tag
        if: steps.version.outputs.is_release == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install TinyTeX
        run: quarto install tinytex
      - name: Build documentation
        run: |
          quarto render --profile en
          quarto render --profile pt
      - name: Prepare Release Artifacts
        if: steps.version.outputs.is_release == 'true'
        run: |
          mkdir -p release_artifacts
          VERSION="${{ steps.version.outputs.version }}"
          ls -R _book
          cp _book/en/ma-quetelye-quenya.pdf release_artifacts/ma-quetelye-quenya-en-${VERSION}.pdf
          cp _book/en/ma-quetelye-quenya.epub release_artifacts/ma-quetelye-quenya-en-${VERSION}.epub
          cp _book/pt/ma-quetelye-quenya.pdf release_artifacts/ma-quetelye-quenya-pt-${VERSION}.pdf
          cp _book/pt/ma-quetelye-quenya.epub release_artifacts/ma-quetelye-quenya-pt-${VERSION}.epub
      - name: Upload release artifacts
        if: steps.version.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: book-artifacts
          path: release_artifacts/
      - name: Assemble site
        if: steps.version.outputs.is_release == 'true' || steps.version.outputs.redeploy_tag != ''
        run: |
          mkdir -p site/pt
          cp -r _book/en/. site/
          cp -r _book/pt/. site/pt/
          echo "ma-quetelye-quenya.tolkien.lu" > site/CNAME
          touch site/.nojekyll
      - name: Deploy to GitHub Pages
        if: steps.version.outputs.is_release == 'true' || steps.version.outputs.redeploy_tag != ''
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: book-artifacts
          path: release_artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: release_artifacts/*
