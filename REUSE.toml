version = 1

# Spec Kit scaffolding generated by `specify init` (github/spec-kit v1.1.0).
[[annotations]]
path = [".specify/**", ".claude/skills/speckit-*/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"

# The constitution is project content, not Spec Kit scaffolding.
[[annotations]]
path = ".specify/memory/constitution.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Bruno Pacheco (https://bruno.pacheco.lu)"
SPDX-License-Identifier = "CC-BY-4.0"

# Specs written with Spec Kit are project content.
[[annotations]]
path = "specs/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Bruno Pacheco (https://bruno.pacheco.lu)"
SPDX-License-Identifier = "CC-BY-4.0"

# GitHub Pages custom-domain file; it cannot carry a comment header.
[[annotations]]
path = "CNAME"
SPDX-FileCopyrightText = "2026 Bruno Pacheco (https://bruno.pacheco.lu)"
SPDX-License-Identifier = "Apache-2.0"

# GitHub templates: a pull request template carries no comment header, because
# GitHub copies the whole file into every new pull request.
[[annotations]]
path = [".github/pull_request_template.md", ".github/ISSUE_TEMPLATE/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Bruno Pacheco (https://bruno.pacheco.lu)"
SPDX-License-Identifier = "Apache-2.0"
