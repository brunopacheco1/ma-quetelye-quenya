project:
  type: book
  render:
    - docs/
  resources:
    - audio/**/*.mp3

profile:
  default: en

book:
  title: "Ma Quetilye Quenya?"
  output-file: "ma-quetelye-quenya"
  author: "Bruno Pacheco"
  date: "2026-04-18"
  url: "https://ma-quetilye-quenya.tolkien.lu"

bibliography: references.bib
filters:
  - filters/alt-text.lua
  - filters/tengwar.lua
format:
  html:
    theme:
      - cosmo
      - styles.scss
  pdf:
    documentclass: scrreprt
    # LuaLaTeX cannot read WOFF2, so the PDF uses the static OTF of the same font.
    include-in-header:
      text: |
        \newfontfamily\tengwarfont{AlcarinTengwar-Regular.otf}[Path=./fonts/, Renderer=HarfBuzz, Scale=1.3]
  epub:
    cover-image: images/cover.jpg
    epub-fonts:
      - fonts/AlcarinTengwar-Regular.otf
    # Not `css:`, which would replace pandoc's default EPUB stylesheet.
    include-in-header: epub-tengwar.html
