project:
  output-dir: _book/pt
# Language of the edition: the HTML lang attribute and Quarto's own labels.
lang: pt
book:
  url: "https://ma-quetilye-quenya.tolkien.lu/pt"
  chapters:
    - index.qmd
    - docs/pt/credits.qmd
    - docs/pt/toc.qmd
    - docs/parande_1.qmd
    - docs/parande_2.qmd
    - docs/parande_3.qmd
    - docs/parande_4.qmd
    - docs/parande_5.qmd
    - docs/parande_6.qmd
    - docs/pt/neologisms.qmd
    - docs/cariquettar.qmd
  sidebar:
    tools:
      - icon: translate
        text: "English"
        href: https://ma-quetilye-quenya.tolkien.lu/

# Texto alternativo das imagens dos capítulos compartilhados, só em Quenya,
# aplicado por filters/alt-text.lua. Manter em sincronia com _quarto-en.yml e raw_images/prompts/.
alt-text:
  greetings.jpg: "Quatro painéis em uma manhã de sol em uma cidade portuária. À esquerda, duas jovens se cumprimentam como amigas, uma acenando e a outra abrindo os braços para um abraço, e depois se despedem acenando por cima do ombro. À direita, um professor idoso de cabelo prateado e um homem de barba com uma mala se cumprimentam com um aperto de mão e uma leve reverência em uma porta de vidro, e depois o professor acena da porta enquanto o homem vai embora. Os balões de fala estão vazios."
  daytime.jpg: "Sete painéis de um dia em uma cidade portuária, cada um com legenda em Tengwar e em letras latinas: ao nascer do sol um oficial de balsa acena para uma mulher com um copo (amaurë); uma jovem com um mapa em uma rua ensolarada (aurë); dois homens comendo sanduíches em um banco ao meio-dia (endaurë); duas mulheres em um café à tarde (apárilë); cinco amigos no muro do porto ao crepúsculo (undómë); um professor cumprimentando uma jovem sob lanternas coloridas no começo da noite (sinyë); e, à noite, um homem com uma mala na porta de uma pousada enquanto outro se afasta acenando (lómë)."
  parande_1_essi.jpg: "Um professor de cabelo comprido prateado e óculos redondos está junto a um quadro branco vazio, com a mão no peito, se apresentando a quatro alunos adultos sentados em uma fileira curva; uma jovem de cabelo dourado responde a ele com a mão no peito. Os alunos usam crachás em branco."
  parande_1_mallo.jpg: "Viajantes com malas descem a rampa de uma balsa para um cais ensolarado com casas brancas e um pequeno farol; um homem de barba é recebido por um homem mais velho de cabelo prateado que acena para ele, e uma jovem com mochila amarela consulta um mapa de papel. Um pequeno barco com proa em forma de cisne está atracado ao lado."
  parande_1_noti.jpg: "Dez lanternas de papel redondas de cores diferentes pendem em fileira sobre uma rua ao anoitecer; por baixo, uma mulher e um homem em uma mesa de café apontam para as lanternas."

